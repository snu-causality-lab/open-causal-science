name = "OpenCausalScienceAnalysis"
version = "0.1.0"
defaultTargets = ["OpenCausalScienceAnalysis", "KimEtAl2026BeyondBounds"]

[leanOptions]
warningAsError = true

[[require]]
name = "OpenCausalScience"
path = ".."

[[require]]
name = "MecLean"
path = "ctf-scb"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[lean_lib]]
name = "OpenCausalScienceAnalysis"
globs = [
  "OpenCausalScienceAnalysis",
  "OpenCausalScienceAnalysis.Decision.SCB2019Theorem4",
  "OpenCausalScienceAnalysis.Decision.SCB2026Transport",
  "OpenCausalScienceAnalysis.Identification.CanonicalDomainReduction",
  "OpenCausalScienceAnalysis.Identification.TianKernelOperations",
  "OpenCausalScienceAnalysis.Uncertainty.ConformalShapley",
]

[[lean_lib]]
name = "KimEtAl2026BeyondBounds"
